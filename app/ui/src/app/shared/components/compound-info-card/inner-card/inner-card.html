<article class="flex flex-col md:flex-row md:px-4 lg:px-2 xl:px-8 gap-4 items-center h-fit py-6  px-2 md:py-0 md:h-full"  
[class]="isLast ? 'border-none' : 'border-b md:border-b-0 md:border-r'"
>
        <div class="p-4 rounded-full " [class]="theme()?.bgSoft">
            <lucide-angular [img]="cardData?.icon" [class]="theme()?.text" />
        </div>
        <div class="flex flex-col">
            <h1 class="text-sm font-semibold">{{cardData?.label}}</h1>
            <p>{{ cardData?.data }}</p>
        </div>
</article>
