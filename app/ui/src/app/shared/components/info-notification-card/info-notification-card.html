<z-card class="w-full border-none p-0! shadow-none rounded-lg" [class]="theme()?.bgSofter">
    <div class="w-full h-full flex flex-col md:flex-col md:pr-1 py-3 pt-6">
        <article class="w-full min-h-full flex flex-col md:flex-row">
            <section class=" w-full md:w-1/12 h-1/3 md:h-full md:mx-4 xl:mx-1 flex justify-center items-start">
                <div class="w-12 h-12 flex items-center justify-center rounded-xl" [class]="theme()?.bgSoft">
                    <lucide-angular [img]="data?.icon" [class]="theme()?.text" />
                </div>
            </section>
            <section class=" h-2/3 w-full md:h-full ">
                <h1 class="font-semibold text-center md:text-start" [class]="theme()?.text">{{data?.label}}</h1>
                <p class="text-sm text-mute mt-4 text-center md:mt-1 md:text-start">{{data?.details}}</p>
            </section>
        </article>
        <section class="w-full min-h-8 px-2 flex items-end justify-end">
            <button z-button class="rounded-lg">Dispensar</button>
        </section>
    </div>
    
</z-card>
