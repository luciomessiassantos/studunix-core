<z-card class=" rounded-xl md:h-full min-w-80 min-h-30 py-0 hover:bg-accent transition-all duration-100 px-4 border-dashed bg-bacground "
[style.width.%]="100"
>
    <div class="w-full h-full flex flex-col justify-center md:justify-start items-start md:items-start">
        <article class="w-full h-25 md:h-2/3 flex items-center">
            <div class="rounded-xl p-3 bg-accent mr-4">
                <lucide-angular [img]="icon" class="text-foreground" />
            </div>
                <h1 class=" font-semibold">{{label}}</h1>
        </article>
        <p class="text-sm text-mute px-2 ">{{details}}</p>
    </div>
</z-card>
