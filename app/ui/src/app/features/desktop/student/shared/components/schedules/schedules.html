<z-card class="p-0! h-full min-w-full! bg-background w-full! shadow-none">
            <div class="w-full h-full px-6 py-4 flex flex-col ">
                <label class="font-medium">Aulas de hoje</label>
                    <main class="w-full h-full pt-2 flex flex-col gap-4 px-1 overflow-y-auto">
                        @if (schedule()) {
                            @for (day of schedule()?.schedules; track $index) {
                                <div class=" w-full min-h-1/3 border rounded-xl ">
                                    <h1 class="font-semibold m-4">
                                        {{day.moduleName}}
                                    </h1>
                                    <section class="w-full flex justify-evenly">
                                        <p>Sala: {{day.room}}</p>
                                        <p>prof: {{day.professor}}</p>
                                        <div class="flex gap-2 font-medium"><p>{{day.startTime.hours}}:{{day.startTime.minutes}}</p> - <p>{{day.endTime.hours}}:{{day.endTime.minutes}}</p></div>
                                    </section>
                                </div>
                            }
                        } @else {
                            <div class=" w-full h-full flex items-center justify-center bg-accent rounded-xl ">
                                <h1 class="text-foreground/50 font-medium text-sm">Sem Aulas</h1>
                            </div>
                        }

                    </main>
            </div>
</z-card>
