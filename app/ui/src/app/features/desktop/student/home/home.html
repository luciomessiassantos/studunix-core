<main class="w-full h-screen pr-5 px-2 overflow-y-auto">

    <section class="w-full min-h-full gap-6 md:min-h-full md:mt-4 flex flex-col md:flex-col px-4">
        
        <div class="w-full h-full md:w-full md:h-full">
            <app-profile-card />
        </div>

        <div class="w-full md:w-full h-full md:h-full">
             <app-academic-calendar />
        </div>
    </section>

    <section class="w-full min-h-9/10 md:h-8/10 pl-4 mt-4 pr-4 md:mt-8">  
        <article class="bg-background border rounded-xl p-4">
        <label class="text-sm font-medium text-foreground">Atualizações recentes</label>
        <div class="mt-3">
          @for (item of updates; track item.label) {
            <div class="flex items-center justify-between py-3 px-2 border-b last:border-b-0
                        hover:bg-accent transition-colors duration-150 ease-in-out rounded-md">
              <div class="flex items-center gap-2 text-sm text-foreground">
                <span class="w-7 h-7 flex items-center justify-center rounded-md"
                      [class]="item.type === 'task' ? 'bg-warning/10' : 'bg-muted'">
                  <lucide-angular [img]="item.type === 'task' ? tarefa : material"
                                  [size]="14" [strokeWidth]="1.5" />
                </span>
                {{ item.label }}
              </div>
              <span class="text-xs text-muted-foreground whitespace-nowrap">{{ item.time }}</span>
            </div>
          }
        </div>
      </article>
        <app-footer />
    </section>
</main>
