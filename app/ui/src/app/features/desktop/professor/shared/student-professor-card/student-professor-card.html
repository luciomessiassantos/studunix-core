<article class="flex items-center gap-3 px-5 py-3 border rounded-xl bg-background
                hover:bg-accent/50 transition-colors duration-150 cursor-pointer">

  <div class="w-9 h-9 rounded-full bg-primary/10 text-primary flex items-center
              justify-center text-xs font-medium shrink-0">
    {{ initials }}
  </div>

  <div class="flex-1 min-w-0">
    <a [routerLink]="data.id" class="hover:underline text-sm font-medium text-foreground truncate">
      {{ data.firstName }} {{ data.lastName }}
    </a>
    <div class="flex items-center gap-1.5 mt-0.5">
      <span class="text-[11px] text-muted-foreground">{{ data.matricula }}</span>
      <span class="text-muted-foreground/40 text-[11px]">·</span>
      <span class="text-[11px] text-muted-foreground">{{ data.period.year }}.{{data.period.semester}}</span>
    </div>
  </div>

  <div class="flex items-center gap-1.5 shrink-0">
    <span class="text-[10px] px-2 py-0.5 rounded-full font-medium
                 bg-muted text-muted-foreground border">
      Turma {{ data.turma }}
    </span>
    @if(data.turno === "Manhã") {
        <z-badge class="bg-primary/10 text-primary rounded-xl">
            Manhã
        </z-badge>
    } @else {
        <z-badge class="bg-slate-400/10 text-slate-900 rounded-xl">
            Noite
        </z-badge>
    }
  </div>

</article>
