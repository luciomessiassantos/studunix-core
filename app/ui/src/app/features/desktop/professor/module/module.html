<main class="w-full h-full">
    <article class="w-full h-1/12 flex items-center gap-4 px-6">
        <button (click)="goBack()" class="border rounded-xl p-2 hover:bg-accent/50 transition-colors duration-100">
            <lucide-angular class="text-xs " [size]="'20'" [img]="leftArrow" />
        </button>
        <h1 class="text-xl font-semibold">Disciplina Título - 2026.1</h1>
    </article>
    <section class="w-full h-11/12 px-6">
        <header class="w-full">
            <z-tab-group class="w-full h-48 px-2 pr-6">
                <z-tab label="Início" class="w-full ">
                    <article class="w-full max-h-120 h-120 overflow-y-auto space-y-6 px-4">
                        <section class="
                        md:w-full md:h-16 md:flex md:gap-4 md:items-start md:mt-2
                        ">
                        <div class="h-full w-1/5 bg-primary rounded-xl p-2 px-4 enter-in">
                            <p class="text-white text-sm">Local</p>
                            <h2 class="text-xl text-white font-semibold">Sala H08</h2>
                        </div>
                        <div class="h-full w-1/5 bg-primary rounded-xl p-2 px-4 enter-in">
                            <p class="text-white text-sm">Total alunos</p>
                            <h2 class="text-xl text-white font-semibold">18</h2>
                        </div>
                        </section>
                        <section class="
                        md:w-full md:h-32
                        ">
                        <table title="Horários" z-table class="border ">
            
                            <thead z-table-header>
                                <tr z-table-row>
                                    <th z-table-head class="bg-accent">
                                        Turma
                                    </th>
                                    <th z-table-head class="border-l bg-accent">
                                        Dia da semana
                                    </th>
                                    <th z-table-head class="border-l bg-accent">
                                        Horários
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr z-table-row>
                                    <td z-table-cell>
                                        A
                                    </td>
                                    <td z-table-cell class="border-l ">
                                        Terça-feira
                                    </td>
                                    <td z-table-cell class="border-l ">
                                        17:50 - 21:50
                                    </td>
                                </tr>
                                <tr z-table-row>
                                    <td z-table-cell>
                                        B
                                    </td>
                                    <td z-table-cell class="border-l ">
                                        Quarta-feira
                                    </td>
                                    <td z-table-cell class="border-l ">
                                        17:50 - 21:50
                                    </td>
                                </tr>
            
                            </tbody>
                        </table>
                        </section>
                        <!-- <section class="
                        md:w-full md:h-128
                        ">
                        </section> -->
                    </article>
                </z-tab>
                <z-tab label="Tarefas">
                    <article class="w-full max-h-120 h-120 overflow-y-auto space-y-8 px-4 pr-4 pb-8">
                        <header class="h-2/14 border-b flex items-center justify-between px-2">
                            <label class="font-semibold text-xl">Turmas</label>
                            <div class="w-1/4 flex items-center justify-end gap-4">
                                <button z-button class="rounded-xl">
                                    <lucide-angular [img]="plus" />
                                    Criar tarefa
                                </button>
                                <button z-button class="rounded-xl">
                                    <lucide-angular [img]="group" />
                                    Criar turma
                                </button>
                            </div>
                        </header>
                        <z-accordion class="w-full min-h-1/5 p-5 text-xl font-medium rounded-2xl border shadow-xs mt-6">
                            <z-accordion-item 
                            zValue="turma-1" zTitle="Turma A - Manhã"
                            class=" flex gap-3 items-center hover:underline cursor-pointer ">
                                <div class="w-full min-h-32 bg-stone-400 rounded-xl">

                                </div>
                            </z-accordion-item>
                        </z-accordion>
                        <div class="w-full h-1/5 p-5  rounded-2xl border shadow-xs ">
                            <h1 class="text-xl font-medium flex gap-3 items-center hover:underline cursor-pointer ">
                               <lucide-angular [img]="sun" /> Turma B - Manhã
                            </h1>
                        </div>
                        <div class="w-full h-1/5 p-5  rounded-2xl border shadow-xs ">
                            <h1 class="text-xl font-medium flex gap-3 items-center hover:underline cursor-pointer ">
                                <lucide-angular [img]="moon" /> Turma A - Noite
                            </h1>
                        </div>
                        <div class="w-full h-1/5 p-5  rounded-2xl border shadow-xs ">
                            <h1 class="text-xl font-medium flex gap-3 items-center hover:underline cursor-pointer ">
                                <lucide-angular [img]="moon" /> Turma A - Noite
                            </h1>
                        </div>
                    </article>
                </z-tab>
                <z-tab label="Materiais">
                    <article class="w-full max-h-120 h-120 overflow-y-auto px-4">
                        <header class="w-full h-1/10 border-b">

                        </header>
                        <div class="w-full h-1/5 p-5  rounded-2xl border shadow-xs mt-6">
                            <h1 class="text-xl font-medium flex gap-3 items-center hover:underline cursor-pointer ">
                                <lucide-angular [img]="folders" />
                                Materiais de Aula
                            </h1>
                        </div>
                    </article>
                </z-tab>
                <z-tab label="Alunos">
                    <article class="w-full max-h-120 h-120 overflow-y-auto px-4">
            
                    </article>
                </z-tab>
            </z-tab-group>
        </header>
    </section>

</main>
