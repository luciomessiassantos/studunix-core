<section class="w-full h-screen bg-accent flex md:flex-row flex-col items-center justify-center relative">
    <lucide-angular [img]="alert" [size]="164" class="text-gray-300/90 md:absolute md:top-30 md:left-45" />
    <article class=" flex flex-col md:flex-row items-center gap-6 z-10">
        <div>
            <h1 class="text-3xl font-[1000] ">Página não encontrada</h1>
            <p>Página que foi acessada não existe</p>
        </div>
        <div>
            <button (click)="backPage()" z-button class="w-40 h-12 text-lg font-semibold rounded-xl">
                Voltar <lucide-angular [img]="back" class="text-xl" [size]="32" />
            </button>
        </div>
    </article>
</section>
