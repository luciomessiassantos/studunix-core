<ng-template
#iconTemplate let-row
>
<lucide-angular [img]="iconMapper(row)" [size]="18" />
</ng-template>

<ng-template
#moreOptions let-row 
>
<div>
        <div zDropdown [zDropdownMenu]="moreOptions" class="rounded-full min-w-5 max-w-6 min-h-6 flex justify-center items-center hover:bg-mute/15 transition-all duration-200 ease-in-out">
            <lucide-angular [img]="more" [size]="16" />
        </div>
        <z-dropdown-menu-content #moreOptions="zDropdownMenuContent"  class="absolute right-40">
            <z-dropdown-menu-item class="hover:bg-pastel-red hover:text-white" (click)="delete(row)">
                <lucide-angular [img]="download" [size]="16" class="mr-1"  />
                <p class="text-sm">Baixar</p>
            </z-dropdown-menu-item>
            <z-dropdown-menu-item class="" (click)="delete(row)">
                <lucide-angular [img]="info" [size]="16" class="mr-1"  />
                <p class="text-sm">Informações</p>
            </z-dropdown-menu-item>
            <z-dropdown-menu-item class="hover:bg-pastel-red/20 hover:text-pastel-red font-medium" (click)="delete(row)">
                <lucide-angular [img]="trash" [size]="16" class="mr-1"  />
                <p class="text-sm">Excluir</p>
            </z-dropdown-menu-item>
        </z-dropdown-menu-content>
    </div>
</ng-template>


<app-data-table [columns]="metadataColumnDef()" [data]="data()" class="text-sm"/>
