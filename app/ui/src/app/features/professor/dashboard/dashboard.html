<main class="w-full h-full flex flex-col min-h-0 overflow-y-auto  ">

    <section class="w-full h-fit md:h-35 px-2 pr-3">
        <app-compound-info-card [data]="cardData" />
    </section>

    <section class="max-w-full h-fit md:min-h-30 mt-4 px-2 pr-3">
        @if (notificationCard) {
            <app-info-notification-card [data]="notificationCard" />
        }
    </section>

    <section class="w-full min-h-full px-3 pr-5 mt-6">
        <label for="" class="text-sm font-medium">Painel principal</label>
            <header class="w-full h-1/12">
                <app-inner-tabs [tabsData]="innerTabsData" />
            </header>
            <section class="w-full h-11/12 mt-1">
                <router-outlet />
            </section>
    </section>
</main>
