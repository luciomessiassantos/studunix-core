    <section class="w-full h-1/10 text-xl font-medium px-3">

    <section class="w-full min-h-8/10 flex md:min-h-8/10 mt-4 px-2 enter-in pb-10">

            <section class=" w-full md:w-full md:max-h-1/5 md:h-1/5 h-full gap-6 flex flex-col md:flex-row">
                @for (card of actionData; track $index) {
                    <app-action-card [lenght]="actionData.length" [label]="card.label" [details]="card.details" [icon]="card.icon" [action]="card.action" />
                }
            </section>

            <div class="w-full min-h-60 p-2">
                <label class="text-sm text-mute p-2 mt-2 flex items-center">
                    <lucide-angular [img]="folders" [size]="16" class="mr-0.5" />

                </label>
                <article class="pr-8 mt-1">
                    <div class="w-full h-10 border-b text-sm p-2 hover:bg-accent flex justify-between items-center">
                        <p>POO - 2025.2 - Noite</p>
                        <p class="text-mute text-xs">agora</p>
                    </div>
                    <div class="w-full h-10 border-b text-sm p-2 hover:bg-accent flex justify-between items-center">
                        <p>Banco_de_DadosI - 2025.2 - Noite</p>
                        <p class="text-mute text-xs">há 2h</p>
                    </div>
                    <div class="w-full h-10 border-b text-sm p-2 hover:bg-accent flex justify-between items-center">
                        <p>Banco_de_DadosII - 2025.2 - Noite</p>
                        <p class="text-mute text-xs">ontem</p>
                    </div>
                </article>
            </div>
            <section class="w-full h-50 pr-10 ">
                <label class="text-sm font-medium text-mute p-2">Notícias</label>
                <app-news-card />
            </section>
        </section>

        <section class="md:w-1/4">
            <app-reminders-calendar />
        </section>
    </section>

</main>
